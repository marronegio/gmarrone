<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Giovanne Marrone — Links</title>
<meta name="description" content="Site, e-book, projetos e WhatsApp — tudo em um só lugar." />
<link rel="icon" type="image/webp" href="/assets/logo.webp" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>

<style>
  :root{
    --bg:#070b15; --surface:#111a2e; --surface-2:#16203a;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
    --ink:#f0f4fb; --muted:#8b95ac;
    --accent:#4d9bff; --accent-glow:rgba(77,155,255,.22);
    --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans); background:var(--bg); color:var(--ink);
    min-height:100vh; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    position:relative; overflow-x:hidden;
  }
  .ambient{
    position:fixed; inset:-20vmax; z-index:-2; pointer-events:none;
    background:
      radial-gradient(38vmax 38vmax at 18% 12%, rgba(77,155,255,0.20), transparent 60%),
      radial-gradient(34vmax 34vmax at 82% 8%, rgba(157,123,255,0.18), transparent 62%),
      radial-gradient(40vmax 40vmax at 72% 88%, rgba(46,230,197,0.12), transparent 60%),
      radial-gradient(36vmax 36vmax at 8% 82%, rgba(77,155,255,0.12), transparent 60%);
    filter: blur(20px) saturate(120%);
    animation: aurora-drift 26s ease-in-out infinite alternate;
  }
  @keyframes aurora-drift{
    0%{transform:translate3d(0,0,0) scale(1) rotate(0deg);}
    50%{transform:translate3d(2%,-2%,0) scale(1.08) rotate(4deg);}
    100%{transform:translate3d(-2%,2%,0) scale(1.04) rotate(-3deg);}
  }
  @media (prefers-reduced-motion: reduce){ .ambient{ animation:none; } }

  .bio{
    max-width:420px; margin:0 auto; min-height:100vh;
    padding:56px 24px 32px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .logo{
    width:40px; height:40px; border-radius:11px; margin-bottom:22px;
    animation: logo-pulse 2.6s ease-in-out infinite;
    will-change: transform, filter;
  }
  @keyframes logo-pulse{
    0%,100%{ transform:scale(1);    filter:drop-shadow(0 0 3px rgba(77,155,255,.40)); }
    50%    { transform:scale(1.06); filter:drop-shadow(0 0 16px rgba(77,155,255,.85)); }
  }
  .avatar-ring{
    width:128px; height:128px; border-radius:50%; padding:3px; margin-bottom:20px;
    background:linear-gradient(135deg,#6ab2ff 0%,#4d9bff 28%,#9d7bff 68%,#2ee6c5 110%);
    box-shadow:0 18px 48px -10px var(--accent-glow);
  }
  .avatar{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:3px solid var(--bg); }
  h1{ font-size:22px; font-weight:700; margin:0 0 6px; letter-spacing:-0.01em; }
  .tagline{ font-size:14.5px; color:var(--muted); margin:0 0 32px; max-width:30ch; line-height:1.5; }

  .links{ display:flex; flex-direction:column; gap:12px; width:100%; }
  .link-btn{
    display:flex; align-items:center; gap:14px;
    padding:14px 18px; border-radius:16px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink); text-decoration:none;
    transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .link-btn .icon{
    width:38px; height:38px; flex:0 0 auto; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--accent);
  }
  .link-btn .icon svg{ width:19px; height:19px; }
  .link-btn .text{ text-align:left; min-width:0; }
  .link-btn .label{ display:block; font-size:15px; font-weight:600; }
  .link-btn .sub{ display:block; font-size:12.5px; color:var(--muted); margin-top:1px; }
  .link-btn .arrow{ margin-left:auto; opacity:.45; transition:transform .15s ease, opacity .15s ease; flex:0 0 auto; }
  .link-btn:hover{ transform:translateY(-2px); border-color:var(--ink); background:var(--surface-2); }
  .link-btn:hover .arrow{ transform:translateX(3px); opacity:.9; }

  .link-btn-primary{
    border-color:transparent; color:#fff;
    background:linear-gradient(135deg,#6ab2ff 0%,#4d9bff 28%,#9d7bff 68%,#2ee6c5 110%);
    box-shadow:0 14px 40px -14px var(--accent-glow);
  }
  .link-btn-primary .icon{ background:rgba(255,255,255,.16); color:#fff; }
  .link-btn-primary .sub{ color:rgba(255,255,255,.75); }
  .link-btn-primary .arrow{ color:#fff; opacity:.85; }
  .link-btn-primary:hover{
    box-shadow:0 18px 48px -10px var(--accent-glow), 0 10px 24px -8px rgba(29,111,224,.55);
  }

  /* E-book — borda luminosa infinita girando */
  @property --ebook-angle{ syntax:"<angle>"; initial-value:0deg; inherits:false; }
  .link-btn-ebook{ position:relative; z-index:0; background-size:220% 220%; background-position:0% 50%; }
  /* Hover: mantém o degradê e o anima (sem trocar a cor de fundo) */
  .link-btn-ebook:hover{
    background-image:linear-gradient(135deg,#6ab2ff 0%,#4d9bff 28%,#9d7bff 68%,#2ee6c5 110%);
    background-size:220% 220%;
    animation:ebook-bg-shift 2.6s ease infinite;
  }
  @keyframes ebook-bg-shift{
    0%  { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .link-btn-ebook::before{
    content:""; position:absolute; inset:-2px; border-radius:18px; padding:2px;
    background:conic-gradient(from var(--ebook-angle),
      transparent 0deg, rgba(255,255,255,.15) 40deg,
      #ffffff 90deg, #2ee6c5 130deg, transparent 200deg, transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:ebook-spin 3s linear infinite;
    z-index:-1; pointer-events:none;
  }
  @keyframes ebook-spin{ to{ --ebook-angle:360deg; } }

  /* WhatsApp — botão verde */
  .link-btn-whats{
    border-color:transparent; color:#fff;
    background:linear-gradient(135deg,#25d366 0%, #1ebe5d 60%, #17a74f 110%);
    box-shadow:0 14px 40px -16px rgba(37,211,102,.55);
  }
  .link-btn-whats .icon{ background:rgba(255,255,255,.18); color:#fff; }
  .link-btn-whats .sub{ color:rgba(255,255,255,.82); }
  .link-btn-whats .arrow{ color:#fff; opacity:.85; }
  .link-btn-whats:hover{
    border-color:transparent; background:linear-gradient(135deg,#2be070 0%, #1ebe5d 60%, #17a74f 110%);
    box-shadow:0 18px 48px -12px rgba(37,211,102,.65);
  }

  @media (prefers-reduced-motion: reduce){
    .logo{ animation:none; }
    .link-btn-ebook::before{ animation:none; }
    .link-btn-ebook:hover{ animation:none; }
  }

  footer{ margin-top:auto; padding-top:36px; font-size:11.5px; color:var(--muted); font-family:var(--font-mono); }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<main class="bio">
  <img class="logo" src="/assets/logo.webp" alt="" width="40" height="40" />

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

        </svg>

      <span class="text">

  </nav>

  <footer>© 2026 Giovanne Marrone</footer>

</body>
